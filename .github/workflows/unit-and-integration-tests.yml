name: Unit and integration tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-and-integration-tests:
    name: unit-and-integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Report canonical environment
        run: |
          cat /etc/os-release
          python3 --version
          node --version
          git --version

      - name: Fetch frozen bundle source
        run: git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --no-write-fetch-head --no-recurse-submodules --no-auto-maintenance --refmap= origin bca92e0f5ac48b1ac4bd24ecf9aebb7a40c89ef1

      - name: Run unit and integration tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
