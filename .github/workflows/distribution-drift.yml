name: Distribution drift guard

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compare skills, manifests, marketplaces, and README
        run: python3 scripts/check-distribution-drift.py
