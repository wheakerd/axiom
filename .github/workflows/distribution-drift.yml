name: Distribution and publication guards

on:
  # Pull requests validate the proposed merge tree only. Release provenance is
  # enforced separately after protected history or a release ref changes.
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check distribution agreement
        run: python3 scripts/check-distribution-drift.py

      - name: Check publication invariants
        run: python3 scripts/check-publication.py
