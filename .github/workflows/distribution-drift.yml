name: Distribution and publication guards

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check distribution agreement
        run: python3 scripts/check-distribution-drift.py

      - name: Check publication invariants
        run: python3 scripts/check-publication.py
