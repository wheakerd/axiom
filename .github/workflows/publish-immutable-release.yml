name: Publish immutable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing strict SemVer tag on signed main history
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-immutable-release
  cancel-in-progress: false

jobs:
  publish-immutable-release:
    if: "github.ref == format('refs/tags/{0}', inputs.tag)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      GITHUB_API_VERSION: "2026-03-10"
    steps:
      - name: Check out the authorized release tag commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - name: Validate evidence and publish the immutable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$commit"

          release_workdir="$(mktemp -d)"
          trap 'rm -rf -- "${release_workdir:?}"' EXIT
          collection="$release_workdir/release-collection.json"
          initial_release="$release_workdir/release-initial.json"
          initial_plan="$release_workdir/plan-initial.json"
          current_release="$release_workdir/release-current.json"
          current_plan="$release_workdir/plan-current.json"
          prepublish_release="$release_workdir/release-prepublish.json"
          final_release="$release_workdir/release-final.json"
          latest_release="$release_workdir/release-latest.json"
          upload_result="$release_workdir/attestation-upload.json"
          cleanup_collection="$release_workdir/release-cleanup-collection.json"

          remote_preflight() {
            local phase="$1"
            local require_main_tip="${2:-false}"
            local repository_metadata="$release_workdir/repository-$phase.json"
            local latest_metadata="$release_workdir/latest-$phase.json"
            local main_ref="$release_workdir/main-ref-$phase.json"
            local tag_ref="$release_workdir/tag-ref-$phase.json"
            local comparison="$release_workdir/history-$phase.json"
            local commit_metadata="$release_workdir/commit-$phase.json"
            local signature="$release_workdir/signature-$phase.json"
            local repository_owner="${GITHUB_REPOSITORY%%/*}"
            local repository_name="${GITHUB_REPOSITORY#*/}"
            local main_sha
            local main_tip_argument=()

            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY" > "$repository_metadata"
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/latest" > "$latest_metadata"
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$main_ref"
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$tag_ref"
            main_sha="$(python3 scripts/check-release-evidence.py ref-commit \
              --ref-metadata "$main_ref" \
              --expected-ref refs/heads/main)"
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/compare/$commit...$main_sha" > "$comparison"
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/commits/$commit" > "$commit_metadata"
            gh api graphql \
              -f query='query($owner: String!, $name: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $name) { object(oid: $oid) { ... on Commit { oid signature { isValid state wasSignedByGitHub } } } } }' \
              -f owner="$repository_owner" \
              -f name="$repository_name" \
              -f oid="$commit" > "$signature"
            if test "$require_main_tip" = "true"; then
              main_tip_argument=(--require-main-tip)
            fi
            python3 scripts/check-release-evidence.py preflight \
              --repository-metadata "$repository_metadata" \
              --latest-release-metadata "$latest_metadata" \
              --main-ref-metadata "$main_ref" \
              --tag-ref-metadata "$tag_ref" \
              --history-comparison "$comparison" \
              --commit-metadata "$commit_metadata" \
              --graphql-signature "$signature" \
              --expected-commit "$commit" \
              --expected-tag "$RELEASE_TAG" \
              "${main_tip_argument[@]}"
          }

          prepare_plan() {
            local metadata="$1"
            local plan="$2"
            python3 scripts/check-release-evidence.py prepare \
              --release-metadata "$metadata" \
              --plan-output "$plan" \
              --expected-version "$version" \
              --expected-tag "$RELEASE_TAG" \
              --expected-commit "$commit" \
              --expected-tree "$tree"
          }

          download_evidence() {
            local plan="$1"
            local directory="$2"
            local observation_id
            local observation_name
            local attestation_id
            local attestation_name
            observation_id="$(python3 scripts/check-release-evidence.py emit --plan "$plan" --field asset-id)"
            observation_name="$(python3 scripts/check-release-evidence.py emit --plan "$plan" --field asset-name)"
            attestation_id="$(python3 scripts/check-release-evidence.py emit --plan "$plan" --field attestation-id)"
            attestation_name="$(python3 scripts/check-release-evidence.py emit --plan "$plan" --field attestation-name)"
            mkdir "$directory"
            downloaded_observation="$directory/$observation_name"
            downloaded_attestation="$directory/$attestation_name"
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$observation_id" > "$downloaded_observation"
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$attestation_id" > "$downloaded_attestation"
          }

          cleanup_mutable_release() {
            local plan="$1"
            local state
            local cleanup_release="$release_workdir/release-cleanup-current.json"
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$cleanup_release"
            state="$(python3 scripts/check-release-evidence.py publication-state \
              --plan "$plan" \
              --release-metadata "$cleanup_release")"
            test "$state" = "mutable"
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id"
            gh api --paginate --slurp \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$cleanup_collection"
            python3 scripts/check-release-evidence.py assert-absent \
              --plan "$plan" \
              --release-collection "$cleanup_collection"
            remote_preflight postcleanup
            echo "GitHub published the frozen Release without immutable protection; the exact mutable Release was removed." >&2
            exit 1
          }

          remote_preflight initial
          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$collection"
          python3 scripts/check-release-evidence.py select \
            --release-collection "$collection" \
            --release-output "$initial_release" \
            --expected-tag "$RELEASE_TAG"
          prepare_plan "$initial_release" "$initial_plan"

          release_id="$(python3 scripts/check-release-evidence.py emit --plan "$initial_plan" --field release-id)"
          release_phase="$(python3 scripts/check-release-evidence.py emit --plan "$initial_plan" --field phase)"
          observation_id="$(python3 scripts/check-release-evidence.py emit --plan "$initial_plan" --field asset-id)"
          observation_name="$(python3 scripts/check-release-evidence.py emit --plan "$initial_plan" --field asset-name)"
          initial_directory="$release_workdir/initial-assets"
          mkdir "$initial_directory"
          initial_observation="$initial_directory/$observation_name"
          gh api \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$observation_id" > "$initial_observation"
          expected_attestation="$(python3 scripts/check-release-evidence.py validate \
            --plan "$initial_plan" \
            --asset "$initial_observation" \
            --attestation-directory "$release_workdir")"
          expected_attestation_name="$(basename -- "$expected_attestation")"

          if test "$release_phase" = "draft"; then
            remote_preflight draft-mutation true
            attestation_present="$(python3 scripts/check-release-evidence.py emit --plan "$initial_plan" --field attestation-present)"
            if test "$attestation_present" = "false"; then
              gh api --method POST \
                -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$expected_attestation_name" \
                --input "$expected_attestation" > "$upload_result"
            fi
          fi

          gh api \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$current_release"
          prepare_plan "$current_release" "$current_plan"
          test "$(python3 scripts/check-release-evidence.py emit --plan "$current_plan" --field release-id)" = "$release_id"
          release_phase="$(python3 scripts/check-release-evidence.py emit --plan "$current_plan" --field phase)"
          test "$(python3 scripts/check-release-evidence.py emit --plan "$current_plan" --field attestation-name)" = "$expected_attestation_name"
          download_evidence "$current_plan" "$release_workdir/current-assets"

          if test "$release_phase" = "published-mutable"; then
            cleanup_mutable_release "$current_plan"
          fi

          if test "$release_phase" = "final"; then
            remote_preflight final-recovery
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$final_release"
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/latest" > "$latest_release"
            python3 scripts/check-release-evidence.py verify \
              --plan "$current_plan" \
              --release-metadata "$final_release" \
              --asset "$downloaded_observation" \
              --attestation "$downloaded_attestation" \
              --latest-release-metadata "$latest_release" \
              --final
            exit 0
          fi

          test "$(python3 scripts/check-release-evidence.py emit --plan "$current_plan" --field phase)" = "draft"
          python3 scripts/check-release-evidence.py verify \
            --plan "$current_plan" \
            --release-metadata "$current_release" \
            --asset "$downloaded_observation" \
            --attestation "$downloaded_attestation"

          remote_preflight prepublish true
          gh api \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$prepublish_release"
          python3 scripts/check-release-evidence.py verify \
            --plan "$current_plan" \
            --release-metadata "$prepublish_release" \
            --asset "$downloaded_observation" \
            --attestation "$downloaded_attestation"

          gh api --method PATCH \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true > "$release_workdir/publication-response.json"

          gh api \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$final_release"
          publication_state="$(python3 scripts/check-release-evidence.py publication-state \
            --plan "$current_plan" \
            --release-metadata "$final_release")"
          if test "$publication_state" = "mutable"; then
            cleanup_mutable_release "$current_plan"
          fi
          test "$publication_state" = "immutable"

          remote_preflight postpublish true
          gh api \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$final_release"
          gh api \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/latest" > "$latest_release"
          download_evidence "$current_plan" "$release_workdir/final-assets"
          python3 scripts/check-release-evidence.py verify \
            --plan "$current_plan" \
            --release-metadata "$final_release" \
            --asset "$downloaded_observation" \
            --attestation "$downloaded_attestation" \
            --prepublish-release-metadata "$prepublish_release" \
            --latest-release-metadata "$latest_release" \
            --final
