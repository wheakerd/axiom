name: Publish immutable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing strict SemVer release tag whose release branch commit is staged
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-immutable-release
  cancel-in-progress: false

jobs:
  publish-immutable-release:
    if: "github.ref == format('refs/tags/{0}', inputs.tag)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      GITHUB_API_VERSION: "2026-03-10"
    steps:
      - name: Check out the authorized release tag commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - name: Validate evidence and publish the immutable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit="$(git rev-parse HEAD)"

          release_workdir="$(mktemp -d)"
          trap 'rm -rf -- "${release_workdir:?}"' EXIT
          subject_directory="$release_workdir/subject"
          python3 -B .ci/scripts/release.py subject \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --output "$subject_directory" > /dev/null
          subject="$subject_directory/subject.json"
          expected_zip="$subject_directory/axiom-${RELEASE_TAG}-plugin.zip"
          read_subject() {
            python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$subject" "$1"
          }
          test "$(read_subject commit)" = "$commit"
          release_commit="$(read_subject releaseCommit)"

          collection="$release_workdir/release-collection.json"
          initial_release="$release_workdir/release-initial.json"
          initial_plan="$release_workdir/plan-initial.json"
          current_release="$release_workdir/release-current.json"
          current_plan="$release_workdir/plan-current.json"
          prepublish_release="$release_workdir/release-prepublish.json"
          final_release="$release_workdir/release-final.json"
          latest_release="$release_workdir/release-latest.json"
          upload_result="$release_workdir/evidence-upload.json"
          cleanup_collection="$release_workdir/release-cleanup-collection.json"

          signature_of() {
            gh api graphql \
              -f query='query($owner: String!, $name: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $name) { object(oid: $oid) { ... on Commit { oid signature { isValid state wasSignedByGitHub } } } } }' \
              -f owner="${GITHUB_REPOSITORY%%/*}" \
              -f name="${GITHUB_REPOSITORY#*/}" \
              -f oid="$1"
          }

          remote_preflight() {
            local phase="$1"
            local prefix="$release_workdir/preflight-$phase"
            local main_sha
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY" > "$prefix-repository.json"
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/latest" > "$prefix-latest.json"
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$prefix-main.json"
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$prefix-tag.json"
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/release" > "$prefix-release.json"
            main_sha="$(python3 .ci/scripts/check-release-evidence.py ref-commit \
              --ref-metadata "$prefix-main.json" \
              --expected-ref refs/heads/main)"
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/compare/$commit...$main_sha" > "$prefix-history.json"
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/commits/$commit" > "$prefix-commit.json"
            signature_of "$commit" > "$prefix-commit-signature.json"
            signature_of "$release_commit" > "$prefix-release-signature.json"
            python3 .ci/scripts/check-release-evidence.py preflight \
              --repository-metadata "$prefix-repository.json" \
              --latest-release-metadata "$prefix-latest.json" \
              --main-ref-metadata "$prefix-main.json" \
              --tag-ref-metadata "$prefix-tag.json" \
              --release-ref-metadata "$prefix-release.json" \
              --history-comparison "$prefix-history.json" \
              --commit-metadata "$prefix-commit.json" \
              --commit-signature "$prefix-commit-signature.json" \
              --release-signature "$prefix-release-signature.json" \
              --subject "$subject"
          }

          prepare_plan() {
            python3 .ci/scripts/check-release-evidence.py prepare \
              --release-metadata "$1" \
              --plan-output "$2" \
              --subject "$subject"
          }

          emit() {
            python3 .ci/scripts/check-release-evidence.py emit --plan "$1" --field "$2"
          }

          download_asset() {
            gh api \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$1" > "$2"
          }

          download_assets() {
            local plan="$1"
            local directory="$2"
            mkdir "$directory"
            downloaded_zip="$directory/$(emit "$plan" zip-name)"
            download_asset "$(emit "$plan" zip-id)" "$downloaded_zip"
            if test "$(emit "$plan" evidence-present)" = "true"; then
              downloaded_evidence="$directory/$(emit "$plan" evidence-name)"
              download_asset "$(emit "$plan" evidence-id)" "$downloaded_evidence"
            fi
          }

          cleanup_mutable_release() {
            local plan="$1"
            local cleanup_release="$release_workdir/release-cleanup-current.json"
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$cleanup_release"
            test "$(python3 .ci/scripts/check-release-evidence.py publication-state \
              --plan "$plan" \
              --release-metadata "$cleanup_release")" = "mutable"
            gh api --method DELETE -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id"
            gh api --paginate --slurp -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$cleanup_collection"
            python3 .ci/scripts/check-release-evidence.py assert-absent \
              --plan "$plan" \
              --release-collection "$cleanup_collection"
            remote_preflight postcleanup
            echo "GitHub published the frozen Release without immutable protection; the exact mutable Release was removed." >&2
            exit 1
          }

          remote_preflight initial
          gh api --paginate --slurp -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$collection"
          python3 .ci/scripts/check-release-evidence.py select \
            --release-collection "$collection" \
            --release-output "$initial_release" \
            --expected-tag "$RELEASE_TAG"
          prepare_plan "$initial_release" "$initial_plan"
          release_id="$(emit "$initial_plan" release-id)"
          release_phase="$(emit "$initial_plan" phase)"
          download_assets "$initial_plan" "$release_workdir/initial-assets"
          expected_evidence="$(python3 .ci/scripts/check-release-evidence.py validate \
            --plan "$initial_plan" \
            --zip "$downloaded_zip" \
            --expected-zip "$expected_zip" \
            --evidence-directory "$release_workdir")"
          expected_evidence_name="$(basename -- "$expected_evidence")"

          if test "$release_phase" = "draft"; then
            remote_preflight draft-mutation
            if test "$(emit "$initial_plan" evidence-present)" = "false"; then
              gh api --method POST \
                -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$expected_evidence_name" \
                --input "$expected_evidence" > "$upload_result"
            fi
          fi

          gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$current_release"
          prepare_plan "$current_release" "$current_plan"
          test "$(emit "$current_plan" release-id)" = "$release_id"
          release_phase="$(emit "$current_plan" phase)"
          test "$(emit "$current_plan" evidence-name)" = "$expected_evidence_name"
          download_assets "$current_plan" "$release_workdir/current-assets"

          if test "$release_phase" = "published-mutable"; then
            cleanup_mutable_release "$current_plan"
          fi

          if test "$release_phase" = "final"; then
            remote_preflight final-recovery
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$final_release"
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/latest" > "$latest_release"
            python3 .ci/scripts/check-release-evidence.py verify \
              --plan "$current_plan" \
              --release-metadata "$final_release" \
                --zip "$downloaded_zip" \
              --expected-zip "$expected_zip" \
              --evidence "$downloaded_evidence" \
              --latest-release-metadata "$latest_release" \
              --final
            python3 .ci/scripts/check-release-evidence.py summary \
              --plan "$current_plan" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          test "$release_phase" = "draft"
          python3 .ci/scripts/check-release-evidence.py verify \
            --plan "$current_plan" \
            --release-metadata "$current_release" \
            --zip "$downloaded_zip" \
            --expected-zip "$expected_zip" \
            --evidence "$downloaded_evidence"

          remote_preflight prepublish
          gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$prepublish_release"
          python3 .ci/scripts/check-release-evidence.py verify \
            --plan "$current_plan" \
            --release-metadata "$prepublish_release" \
            --zip "$downloaded_zip" \
            --expected-zip "$expected_zip" \
            --evidence "$downloaded_evidence"

          gh api --method PATCH \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true > "$release_workdir/publication-response.json"

          gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$final_release"
          publication_state="$(python3 .ci/scripts/check-release-evidence.py publication-state \
            --plan "$current_plan" \
            --release-metadata "$final_release")"
          if test "$publication_state" = "mutable"; then
            cleanup_mutable_release "$current_plan"
          fi
          test "$publication_state" = "immutable"

          remote_preflight postpublish
          gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$final_release"
          gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "repos/$GITHUB_REPOSITORY/releases/latest" > "$latest_release"
          download_assets "$current_plan" "$release_workdir/final-assets"
          python3 .ci/scripts/check-release-evidence.py verify \
            --plan "$current_plan" \
            --release-metadata "$final_release" \
            --zip "$downloaded_zip" \
            --expected-zip "$expected_zip" \
            --evidence "$downloaded_evidence" \
            --prepublish-release-metadata "$prepublish_release" \
            --latest-release-metadata "$latest_release" \
            --final
          python3 .ci/scripts/check-release-evidence.py summary \
            --plan "$current_plan" >> "$GITHUB_STEP_SUMMARY"
