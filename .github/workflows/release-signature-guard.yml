name: Release signature guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types:
      - published
      - edited
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-github-signature:
    name: Verify GitHub-signed release target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GitHub signature
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const repositoryResponse = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repositoryResponse.data.default_branch;
            if (defaultBranch !== "main") {
              core.setFailed(
                `Release policy requires main to be the default branch; found ${defaultBranch}.`,
              );
              return;
            }

            const defaultRef = `refs/heads/${defaultBranch}`;
            const strictSemVer = /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

            function releaseTagVersion(tagName) {
              if (typeof tagName !== "string" || !tagName.startsWith("v")) {
                return null;
              }
              const version = tagName.slice(1);
              return strictSemVer.test(version) ? version : null;
            }

            function isSingleTagCreation(payload) {
              return (
                payload.created === true &&
                payload.deleted === false &&
                payload.forced === false &&
                typeof payload.before === "string" &&
                /^0{40}$/.test(payload.before) &&
                typeof payload.after === "string" &&
                /^(?!0{40}$)[0-9a-f]{40}$/i.test(payload.after)
              );
            }

            function failClosedTagMutation(reason) {
              core.setFailed(
                `${reason} This workflow fails closed after the mutation; true server-side prevention still depends on a GitHub tag ruleset that blocks tag updates and deletions.`,
              );
            }

            async function readJsonAtCommit(path, commitSha) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: commitSha,
              });
              const content = response.data;
              if (
                Array.isArray(content) ||
                content.type !== "file" ||
                content.encoding !== "base64" ||
                typeof content.content !== "string"
              ) {
                throw new Error(`Cannot read exact JSON file ${path} at ${commitSha}.`);
              }
              return JSON.parse(
                Buffer.from(content.content.replace(/\n/g, ""), "base64").toString("utf8"),
              );
            }

            async function packageVersionAtCommit(commitSha) {
              const paths = [
                ".codex-plugin/plugin.json",
                ".claude-plugin/plugin.json",
              ];
              const manifests = await Promise.all(
                paths.map((path) => readJsonAtCommit(path, commitSha)),
              );
              const versions = manifests.map((manifest) => manifest?.version);
              if (
                versions.some(
                  (version) => typeof version !== "string" || !strictSemVer.test(version),
                ) ||
                versions[0] !== versions[1]
              ) {
                throw new Error(
                  `Release manifests at ${commitSha} must contain one matching strict SemVer version.`,
                );
              }
              return versions[0];
            }

            async function peelRefToCommit(qualifiedRef, expectedObjectSha = null) {
              const reference = await github.rest.git.getRef({
                owner,
                repo,
                ref: qualifiedRef.replace(/^refs\//, ""),
              });
              if (reference.data.ref !== qualifiedRef) {
                throw new Error(
                  `Resolved ${reference.data.ref} while verifying exact ref ${qualifiedRef}.`,
                );
              }

              let object = reference.data.object;
              if (expectedObjectSha !== null && object.sha !== expectedObjectSha) {
                throw new Error(
                  `Ref ${qualifiedRef} changed after this event; expected ${expectedObjectSha}, found ${object.sha}.`,
                );
              }
              const visited = new Set();
              for (let depth = 0; depth < 16; depth += 1) {
                if (object.type === "commit") {
                  return object.sha;
                }
                if (object.type !== "tag" || visited.has(object.sha)) {
                  throw new Error(
                    `Ref ${qualifiedRef} does not peel uniquely to a commit.`,
                  );
                }
                visited.add(object.sha);
                const tag = await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: object.sha,
                });
                object = tag.data.object;
              }
              throw new Error(`Ref ${qualifiedRef} exceeds the tag peel depth limit.`);
            }

            let targetRef;
            let targetCommit;
            let targetTagName = null;
            let targetMustDescendFromDefault = false;
            if (context.eventName === "pull_request") {
              const pullRequest = context.payload.pull_request;
              if (pullRequest?.base?.ref !== defaultBranch) {
                core.setFailed(
                  `Release pull requests must target ${defaultRef}.`,
                );
                return;
              }
              if (pullRequest?.head?.repo?.full_name !== `${owner}/${repo}`) {
                core.setFailed(
                  "Release pull requests must use a branch in this repository.",
                );
                return;
              }
              targetRef = `pull request #${pullRequest.number} head`;
              targetCommit = pullRequest.head.sha;
              targetMustDescendFromDefault = true;
            } else if (context.eventName === "release") {
              const tagName = context.payload.release?.tag_name;
              if (releaseTagVersion(tagName) === null) {
                core.setFailed("Published releases must use one exact strict SemVer tag.");
                return;
              }
              targetTagName = tagName;
              targetRef = `refs/tags/${tagName}`;
              targetCommit = await peelRefToCommit(targetRef);
            } else if (context.eventName === "push") {
              if (context.ref === defaultRef) {
                targetRef = defaultRef;
                targetCommit = context.payload.after;
              } else if (context.ref.startsWith("refs/tags/")) {
                const tagName = context.ref.slice("refs/tags/".length);
                if (releaseTagVersion(tagName) === null) {
                  core.setFailed(`Tag push ${tagName} is not one exact strict SemVer tag.`);
                  return;
                }
                if (!isSingleTagCreation(context.payload)) {
                  failClosedTagMutation(
                    `Tag push ${context.ref} was not a single immutable creation event.`,
                  );
                  return;
                }
                targetTagName = tagName;
                targetRef = context.ref;
                targetCommit = await peelRefToCommit(targetRef, context.payload.after);
              } else {
                core.setFailed(`Unexpected push ref ${context.ref}.`);
                return;
              }
            } else if (context.eventName === "workflow_dispatch") {
              if (context.ref === defaultRef) {
                targetRef = defaultRef;
              } else if (
                /^refs\/heads\/release\/v[0-9]+\.[0-9]+\.[0-9]+$/.test(context.ref)
              ) {
                targetRef = context.ref;
                targetMustDescendFromDefault = true;
              } else {
                core.setFailed(`Unexpected manual verification ref ${context.ref}.`);
                return;
              }
              targetCommit = await peelRefToCommit(targetRef);
            } else {
              core.setFailed(`Unsupported event ${context.eventName}.`);
              return;
            }

            if (typeof targetCommit !== "string" || targetCommit.length === 0) {
              core.setFailed(`Could not resolve ${targetRef} to an exact commit.`);
              return;
            }

            const packageVersion = await packageVersionAtCommit(targetCommit);
            if (targetTagName !== null) {
              const expectedReleaseTag = `v${packageVersion}`;
              if (targetTagName !== expectedReleaseTag) {
                core.setFailed(
                  `Release tag ${targetTagName} does not match package version ${expectedReleaseTag}.`,
                );
                return;
              }
            }

            const defaultCommit = await peelRefToCommit(defaultRef);
            const historyBase = targetMustDescendFromDefault
              ? defaultCommit
              : targetCommit;
            const historyHead = targetMustDescendFromDefault
              ? targetCommit
              : defaultCommit;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${historyBase}...${historyHead}`,
              per_page: 1,
            });
            if (
              comparison.data.merge_base_commit?.sha !== historyBase ||
              !["ahead", "identical"].includes(comparison.data.status)
            ) {
              core.setFailed(
                targetMustDescendFromDefault
                  ? `Target ${targetCommit} does not descend from ${defaultRef}.`
                  : `Target ${targetCommit} is not on the ${defaultRef} history policy.`,
              );
              return;
            }

            const result = await github.graphql(
              `query($owner: String!, $name: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $name) {
                  object(oid: $oid) {
                    ... on Commit {
                      oid
                      signature {
                        isValid
                        state
                        wasSignedByGitHub
                      }
                    }
                  }
                }
              }`,
              {
                owner,
                name: repo,
                oid: targetCommit,
              },
            );

            const commit = result.repository.object;
            const signature = commit?.signature;

            if (
              commit?.oid !== targetCommit ||
              signature?.isValid !== true ||
              signature?.state !== "VALID" ||
              signature?.wasSignedByGitHub !== true
            ) {
              core.setFailed(
                `Release target commit ${targetCommit} must have a valid signature made with GitHub's signing key.`,
              );
              return;
            }

            core.info(
              `${targetRef} resolves to ${targetCommit}, satisfies the ${defaultRef} history policy, and has a valid signature made with GitHub's signing key.`,
            );
