name: Cross-platform hook runtime integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  hook-runtime:
    name: hook-runtime-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Report canonical environment
        run: python -B -m tests.hook_runtime_integration --report-environment

      - name: Execute exact SessionStart hooks
        run: python -B -m unittest tests.hook_runtime_integration -v

  hook-runtime-gate:
    name: hook-runtime-gate
    if: ${{ always() }}
    needs:
      - hook-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful native matrix
        env:
          HOOK_RUNTIME_RESULT: ${{ needs.hook-runtime.result }}
        run: test "$HOOK_RUNTIME_RESULT" = success
